<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#030712" stroke="url(#grad)" stroke-width="4" />
  <text x="64" y="80" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="52" font-weight="bold" fill="url(#grad)" text-anchor="middle" filter="url(#glow)">&lt;/&gt;</text>
</svg>
